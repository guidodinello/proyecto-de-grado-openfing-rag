<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Trebuchet MS', 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7780"/>
    </marker>

    <!-- icons, colored via currentColor -->
    <g id="icon-browser">
      <rect x="0" y="0" width="40" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <line x1="0" y1="10" x2="40" y2="10" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="6" cy="5" r="1.7" fill="currentColor"/>
      <circle cx="12.5" cy="5" r="1.7" fill="currentColor"/>
      <circle cx="19" cy="5" r="1.7" fill="currentColor"/>
    </g>

    <!-- official Docker mark (simple-icons, docker.svg) -->
    <g id="icon-whale">
      <path d="M13.983 11.078h2.119a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.185v1.888c0 .102.083.185.185.185m-2.954-5.43h2.118a.186.186 0 00.186-.186V3.574a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m0 2.716h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.887c0 .102.082.185.185.186m-2.93 0h2.12a.186.186 0 00.184-.186V6.29a.185.185 0 00-.185-.185H8.1a.185.185 0 00-.185.185v1.887c0 .102.083.185.185.186m-2.964 0h2.119a.186.186 0 00.185-.186V6.29a.185.185 0 00-.185-.185H5.136a.186.186 0 00-.186.185v1.887c0 .102.084.185.186.186m5.893 2.715h2.118a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m-2.93 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.083.185.185.185m-2.964 0h2.119a.185.185 0 00.185-.185V9.006a.185.185 0 00-.184-.186h-2.12a.186.186 0 00-.186.186v1.887c0 .102.084.185.186.185m-2.92 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.082.185.185.185M23.763 9.89c-.065-.051-.672-.51-1.954-.51-.338.001-.676.03-1.01.087-.248-1.7-1.653-2.53-1.716-2.566l-.344-.199-.226.327c-.284.438-.49.922-.612 1.43-.23.97-.09 1.882.403 2.661-.595.332-1.55.413-1.744.42H.751a.751.751 0 00-.75.748 11.376 11.376 0 00.692 4.062c.545 1.428 1.355 2.48 2.41 3.124 1.18.723 3.1 1.137 5.275 1.137.983.003 1.963-.086 2.93-.266a12.248 12.248 0 003.823-1.389c.98-.567 1.86-1.288 2.61-2.136 1.252-1.418 1.998-2.997 2.553-4.4h.221c1.372 0 2.215-.549 2.68-1.009.309-.293.55-.65.707-1.046l.098-.288Z" fill="currentColor"/>
    </g>

    <!-- official NGINX mark (simple-icons, nginx.svg) -->
    <g id="icon-nginx">
      <path d="M12 0L1.605 6v12L12 24l10.395-6V6L12 0zm6 16.59c0 .705-.646 1.29-1.529 1.29-.631 0-1.351-.255-1.801-.81l-6-7.141v6.66c0 .721-.57 1.29-1.274 1.29H7.32c-.721 0-1.29-.6-1.29-1.29V7.41c0-.705.63-1.29 1.5-1.29.646 0 1.38.255 1.83.81l5.97 7.141V7.41c0-.721.6-1.29 1.29-1.29h.075c.72 0 1.29.6 1.29 1.29v9.18H18z" fill="currentColor"/>
    </g>

    <g id="icon-atom">
      <g fill="none" stroke="currentColor" stroke-width="2.4">
        <ellipse cx="16" cy="16" rx="16" ry="6.5"/>
        <ellipse cx="16" cy="16" rx="16" ry="6.5" transform="rotate(60 16 16)"/>
        <ellipse cx="16" cy="16" rx="16" ry="6.5" transform="rotate(120 16 16)"/>
      </g>
      <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
    </g>

    <g id="icon-bolt">
      <path d="M15,0 L2,20 L12,20 L9,34 L26,12 L15,12 Z" fill="currentColor"/>
    </g>

    <g id="icon-db">
      <path d="M0,6 C0,2.5 7,0 16,0 C25,0 32,2.5 32,6 L32,26 C32,29.5 25,32 16,32 C7,32 0,29.5 0,26 Z" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M0,6 C0,9.5 7,12 16,12 C25,12 32,9.5 32,6" fill="none" stroke="currentColor" stroke-width="2.4"/>
    </g>
  </defs>

  <!-- Usuario / Navegador -->
  <g filter="url(#shadow)">
    <rect x="245" y="20" width="410" height="84" rx="16" fill="#f4f4f2"/>
  </g>
  <g color="#2f3d46">
    <use href="#icon-browser" transform="translate(273,46)"/>
  </g>
  <text x="331" y="68" font-size="26" font-weight="bold" fill="#2f3d46">Usuario / Navegador</text>

  <line x1="450" y1="104" x2="450" y2="146" stroke="#6b7780" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Docker Compose boundary -->
  <rect x="60" y="150" width="780" height="440" rx="22" fill="none" stroke="#12796a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <g color="#2496ED">
    <use href="#icon-whale" transform="translate(84,164) scale(1.7)"/>
  </g>
  <text x="126" y="187" font-size="17" font-weight="bold" fill="#12796a">Docker Compose</text>

  <!-- Nginx -->
  <g filter="url(#shadow)">
    <rect x="310" y="150" width="280" height="76" rx="18" fill="#f4f4f2" stroke="#c0490c" stroke-width="3"/>
  </g>
  <g color="#009639">
    <use href="#icon-nginx" transform="translate(378,170) scale(1.5)"/>
  </g>
  <text x="428" y="197" font-size="27" font-weight="bold" fill="#2f3d46">Nginx</text>

  <!-- split arrows -->
  <line x1="450" y1="226" x2="450" y2="256" stroke="#6b7780" stroke-width="2.5"/>
  <line x1="450" y1="256" x2="260" y2="256" stroke="#6b7780" stroke-width="2.5"/>
  <line x1="450" y1="256" x2="640" y2="256" stroke="#6b7780" stroke-width="2.5"/>
  <line x1="260" y1="256" x2="260" y2="296" stroke="#6b7780" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="256" x2="640" y2="296" stroke="#6b7780" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="110" y="300" width="300" height="112" rx="16" fill="#f4f4f2"/>
  </g>
  <g color="#2f3d46">
    <use href="#icon-atom" transform="translate(244,318)"/>
  </g>
  <text x="260" y="378" font-size="24" font-weight="bold" fill="#2f3d46" text-anchor="middle">Frontend</text>
  <text x="260" y="403" font-size="17" fill="#6b7780" text-anchor="middle">React</text>

  <!-- Backend -->
  <g filter="url(#shadow)">
    <rect x="490" y="300" width="300" height="112" rx="16" fill="#f4f4f2"/>
  </g>
  <g color="#2f3d46">
    <use href="#icon-bolt" transform="translate(626,318) scale(1.05)"/>
  </g>
  <text x="640" y="378" font-size="24" font-weight="bold" fill="#2f3d46" text-anchor="middle">Backend</text>
  <text x="640" y="403" font-size="17" fill="#6b7780" text-anchor="middle">FastAPI</text>

  <!-- arrow backend -> postgres -->
  <line x1="640" y1="412" x2="640" y2="472" stroke="#6b7780" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="668" y="448" font-size="16" fill="#6b7780">red interna</text>

  <!-- PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="490" y="480" width="300" height="100" rx="16" fill="#f4f4f2" stroke="#12796a" stroke-width="3"/>
  </g>
  <g color="#12796a">
    <use href="#icon-db" transform="translate(624,496)"/>
  </g>
  <text x="640" y="560" font-size="24" font-weight="bold" fill="#2f3d46" text-anchor="middle">PostgreSQL</text>
</svg>

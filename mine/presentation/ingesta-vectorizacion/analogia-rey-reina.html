<title>Analogía Rey Reina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body{ background:#EEF1F5; color:#1E2430; font-family:'IBM Plex Sans', system-ui, sans-serif;
        display:flex; flex-direction:column; align-items:center; gap:16px; padding-block:40px; }
  h1{ font-size:15px; font-weight:600; letter-spacing:.02em; color:#5B6472; margin:0; text-transform:uppercase; }
  .frame{ background:#fff; border-radius:10px; padding:24px; box-shadow:0 2px 10px rgba(30,36,48,.08); max-width:100%; overflow-x:auto; }
</style>
<h1>Diapo &middot; Ingesta &mdash; Vectorización &middot; analogía embeddings</h1>
<div class="frame">
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="480" viewBox="0 0 620 480" font-family="'IBM Plex Sans', system-ui, sans-serif">
  <rect width="620" height="480" fill="#ffffff"/>

  <!-- axes -->
  <line x1="80" y1="400" x2="80" y2="60" stroke="#C9D1DB" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <line x1="80" y1="400" x2="540" y2="400" stroke="#C9D1DB" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <text x="80" y="45" text-anchor="middle" font-size="11.5" fill="#8993A3">realeza</text>
  <text x="555" y="404" text-anchor="start" font-size="11.5" fill="#8993A3">género</text>
  <text x="300" y="440" text-anchor="middle" font-size="10" fill="#AEB7C2" font-style="italic">proyección simplificada en 2 dimensiones</text>

  <!-- gender vector: hombre -> mujer (bottom) -->
  <line x1="180" y1="340" x2="440" y2="340" stroke="#28405C" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowNavy)"/>
  <!-- gender vector: rey -> reina (top), same length -->
  <line x1="180" y1="140" x2="440" y2="140" stroke="#28405C" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowNavy)"/>

  <!-- royalty vector: hombre -> rey (left) -->
  <line x1="180" y1="340" x2="180" y2="140" stroke="#1F8A70" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <!-- royalty vector: mujer -> reina (right) -->
  <line x1="440" y1="340" x2="440" y2="140" stroke="#1F8A70" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- vector labels -->
  <text x="310" y="332" text-anchor="middle" font-size="11" fill="#28405C" font-style="italic">+ género</text>
  <text x="140" y="245" text-anchor="middle" font-size="11" fill="#1F8A70" font-style="italic" transform="rotate(-90 140 245)">+ realeza</text>

  <!-- points -->
  <circle cx="180" cy="340" r="6" fill="#5B6472"/>
  <text x="180" y="366" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E2430">hombre</text>

  <circle cx="440" cy="340" r="6" fill="#5B6472"/>
  <text x="440" y="366" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E2430">mujer</text>

  <circle cx="180" cy="140" r="6" fill="#28405C"/>
  <text x="180" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#28405C">rey</text>

  <circle cx="440" cy="140" r="6" fill="#28405C"/>
  <text x="440" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#28405C">reina</text>

  <!-- equation -->
  <rect x="150" y="450" width="1" height="1" fill="none"/>
  <text x="310" y="466" text-anchor="middle" font-size="14" font-family="'IBM Plex Mono',monospace" fill="#153F35">rey − hombre + mujer ≈ reina</text>

  <defs>
    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#C9D1DB"/>
    </marker>
    <marker id="arrowNavy" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#28405C"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1F8A70"/>
    </marker>
  </defs>
</svg>
</div>

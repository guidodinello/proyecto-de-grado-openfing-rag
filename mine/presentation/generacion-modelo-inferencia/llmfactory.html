<title>LLM Factory</title>

<style>

  <!-- Runnable interface -->

  <line x1="350" y1="140" x2="350" y2="168" stroke="#28405C" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <text x="362" y="158" font-size="10.5" fill="#28405C" font-style="italic">implementa</text>

  <rect x="220" y="170" width="260" height="52" rx="8" fill="#28405C"/>

  <line x1="420" y1="222" x2="540" y2="252" stroke="#28405C" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
